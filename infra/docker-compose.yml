services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: node apps/api/src/server.mjs
    volumes: ["..:/app"]
    environment: ["PORT=4100", "REDIS_URL=redis://redis:6379", "CLICKHOUSE_URL=http://clickhouse:8123", "S3_ENDPOINT=http://minio:9000"]
    expose: ["4100"]
    depends_on: [redis, postgres, clickhouse, minio]
  gateway:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["4100:80"]
    depends_on: [api]
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
  postgres:
    image: postgres:17-alpine
    environment: ["POSTGRES_DB=globalreach", "POSTGRES_USER=globalreach", "POSTGRES_PASSWORD=globalreach-local"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./postgres/archive:/archive"]
    command: ["postgres","-c","wal_level=replica","-c","archive_mode=on","-c","archive_command=test ! -f /archive/%f && cp %p /archive/%f","-c","max_wal_senders=10"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    volumes: ["clickhouse:/var/lib/clickhouse", "./clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: ["MINIO_ROOT_USER=localadmin", "MINIO_ROOT_PASSWORD=localpassword"]
    volumes: ["objects:/data"]
    ports: ["9001:9001"]
  prometheus:
    image: prom/prometheus:v3.4.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
volumes: {pgdata: {}, clickhouse: {}, objects: {}}
