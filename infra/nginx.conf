events {}
http {
  upstream api_pool { zone api_pool 64k; server api:4100 resolve; }
  limit_req_zone $binary_remote_addr zone=public:10m rate=100r/s;
  server {
    listen 80;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
    location / { limit_req zone=public burst=200 nodelay; proxy_pass http://api_pool; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Request-Id $request_id; }
  }
}
