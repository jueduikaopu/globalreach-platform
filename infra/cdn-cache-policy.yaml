version: 1
rules:
  - match: "**/*.{js,css,woff2,svg,png,jpg,jpeg,webp,avif}"
    cache_control: "public, max-age=31536000, immutable"
    edge_ttl_seconds: 31536000
  - match: "/images/**"
    cache_key: [host, path, width, quality, format]
    cache_control: "public, max-age=86400, stale-while-revalidate=604800"
  - match: "/{locale}/**"
    cache_control: "public, s-maxage=300, stale-while-revalidate=86400"
    bypass_on_cookie: [session, preview]
  - match: "/api/public/**"
    cache_control: "public, s-maxage=60, stale-while-revalidate=300"
  - match: "/api/auth/**"
    cache_control: "no-store"
