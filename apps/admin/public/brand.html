<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>品牌影响力 · GlobalReach</title><link rel="stylesheet" href="/admin/brand.css"></head><body><aside><a class="logo" href="/admin/">G</a><a class="on" href="#dashboard">总览</a><a href="#library">内容库</a><a href="#channels">媒体</a><a href="#assets">资产</a></aside><main><header><div><small>BRAND INFLUENCE OS</small><h1>把品牌故事，送到全球买家面前</h1><p>内容复用、多渠道分发与声量归因的一体化工作台。</p></div><button id="newTask">＋ 创建分发任务</button></header><section id="dashboard" class="hero-grid"><div class="metrics" id="metrics"></div><div class="panel chart"><div class="title"><div><small>CHANNEL ATTRIBUTION</small><h2>渠道声量表现</h2></div><span>Mock 归因</span></div><div id="chart"></div></div></section><section class="two"><div class="panel" id="library"><div class="title"><div><small>CONNECTED CONTENT</small><h2>建站内容库</h2></div><span>引用原始 ID · 无需重复上传</span></div><div class="tabs"><button class="active" data-filter="">全部</button><button data-filter="product">产品</button><button data-filter="article">文章</button><button data-filter="news">新闻</button></div><div id="sources"></div></div><div class="panel composer" id="distribution"><div class="title"><div><small>DISTRIBUTION TASK</small><h2>多渠道精准分发</h2></div><span class="mock">MOCK PUBLISH</span></div><div id="selectedContent" class="selected">请从左侧内容库选择内容</div><label>选择渠道</label><div id="channelPicker"></div><label>定时发布（可选）</label><input id="schedule" type="datetime-local"><button class="primary wide" id="distribute">创建并执行任务</button></div></section><section class="panel" id="channels"><div class="title"><div><small>MEDIA DIRECTORY</small><h2>海外媒体与渠道目录</h2></div><span>搜索 · 新闻 · 论坛 · 产品 · 博客</span></div><div id="channelCards" class="channels"></div></section><section class="two"><div class="panel"><div class="title"><h2>分发任务与状态</h2><button id="runWorker">执行到期任务</button></div><div id="tasks"></div></div><div class="panel" id="assets"><div class="title"><h2>品牌资产库</h2><button id="addAsset">＋ 新增资料</button></div><div id="profile"></div><div id="assetList" class="asset-list"></div></div></section></main><dialog id="assetDialog"><form method="dialog"><h2>新增品牌资产</h2><label>类型<select id="assetType"><option value="press_release">新闻稿</option><option value="product_kit">产品资料</option><option value="logo">Logo</option><option value="slogan">Slogan</option></select></label><label>名称<input id="assetName" value="Global Brand Press Kit"></label><label>内容<textarea id="assetBody" rows="4">面向全球媒体与采购商的品牌介绍和产品资料。</textarea></label><div class="end"><button value="cancel">取消</button><button type="button" class="primary" id="saveAsset">保存资产</button></div></form></dialog><div id="toast"></div><script src="/admin/brand.js"></script></body></html>
