<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>社交媒体营销 · GlobalReach</title><link rel="stylesheet" href="/admin/social.css"></head><body><aside class="rail"><a class="brand" href="/admin/">G</a><a class="active" href="#studio">发帖</a><a href="#inbox">收件箱</a><a href="#calendar">日历</a><a href="#assets">素材</a></aside><main><header><div><span>SOCIAL COMMAND CENTER</span><h1>让品牌声音，跨越每一个市场</h1><p>多平台、多账号、多语言内容发布与互动聚合。</p></div><button id="bindTop">＋ 绑定账号</button></header><section class="metrics" id="metrics"></section><section class="layout" id="studio"><div class="panel compose"><div class="panel-title"><div><small>SMART PUBLISHING</small><h2>智能发帖工作台</h2></div><span class="mock">MOCK MODE</span></div><label>选择发布账号</label><div id="accountPicker" class="account-picker"></div><label>帖文内容</label><textarea id="postText" rows="6">Discover our latest global collection — designed for buyers who value quality, speed and reliable supply.</textarea><div class="row"><button id="aiCopy">✨ AI 文案占位</button><select id="locale"><option value="es">西班牙语</option><option value="de">德语</option><option value="fr">法语</option><option value="ja">日语</option><option value="pt">葡萄牙语</option><option value="ar">阿拉伯语</option></select><button id="translate">翻译预览</button></div><div id="translation" class="translation"></div><div class="media"><div><b>＋ 添加图片 / 视频</b><small>Mock 素材引用，不上传真实文件</small></div><input id="mediaUrl" placeholder="https://example.com/media.jpg"></div><div class="publish"><input id="schedule" type="datetime-local"><button id="saveAsset">存为素材</button><button class="primary" id="publish">一键同步发布</button></div></div><div class="panel accounts"><div class="panel-title"><h2>账号池</h2><button id="bind">绑定 Mock 账号</button></div><div id="accounts"></div><h3>最近发布</h3><div id="posts"></div></div></section><section class="panel" id="inbox"><div class="panel-title"><div><small>UNIFIED INBOX</small><h2>聚合互动收件箱</h2></div><select id="inboxFilter"><option value="">全部平台</option><option value="facebook">Facebook</option><option value="linkedin">LinkedIn</option><option value="youtube">YouTube</option></select></div><div class="inbox-grid"><div id="messages"></div><div id="replyPane" class="reply-pane"><div class="empty">选择一条评论或私信开始回复</div></div></div></section><section class="panel" id="calendar"><div class="panel-title"><div><small>GLOBAL MOMENTS</small><h2>海外节日营销日历</h2></div><input id="month" type="month" value="2027-11"></div><div id="holidays" class="holidays"></div></section><section class="panel" id="assets"><div class="panel-title"><div><small>CONTENT LIBRARY</small><h2>统一素材库</h2></div><span>图片 · 视频 · 文案 · 提示词</span></div><div id="assetList" class="assets"></div></section></main><dialog id="accountDialog"><form method="dialog"><h2>绑定社媒账号</h2><label>平台<select id="platform"><option value="facebook">Facebook</option><option value="linkedin">LinkedIn</option><option value="youtube">YouTube</option></select></label><label>账号名称<input id="accountName" value="GlobalReach Demo"></label><p>本地开发使用 Mock OAuth，不会访问真实平台账号。</p><div class="row end"><button value="cancel">取消</button><button type="button" class="primary" id="confirmBind">Mock 授权</button></div></form></dialog><div id="toast"></div><script src="/admin/social.js"></script></body></html>
