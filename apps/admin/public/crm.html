<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM 客户资产中枢 · GlobalReach</title><link rel="stylesheet" href="/admin/crm.css"></head><body>
<aside><a class="logo" href="/admin/">G<span>R</span></a><nav><a href="/admin/">总览</a><a href="/admin/templates.html">独立站</a><a href="/admin/insights.html">商机洞察</a><a href="/admin/email.html">邮件营销</a><a href="/admin/social.html">社媒营销</a><a href="/admin/brand.html">品牌影响力</a><a class="active" href="/admin/crm.html">客户关系 CRM</a></nav><div class="aside-foot"><small>统一客户数据层</small><b id="role">正在验证权限…</b></div></aside>
<main><header><div><p class="eyebrow">CUSTOMER INTELLIGENCE</p><h1>客户资产中枢</h1><p>把询盘、社媒互动、独立站访客和海关商机汇成一张客户主档。</p></div><div class="actions"><button class="ghost" id="recycle">回收 30 天未跟进</button><button id="seed">生成三渠道演示数据</button></div></header>
<section class="metrics" id="metrics"></section>
<section class="toolbar"><div class="tabs"><button class="tab active" data-view="customers">客户列表</button><button class="tab" data-view="board">销售看板</button><button class="tab" data-view="pool">公海池 <i id="poolCount">0</i></button><button class="tab" data-view="duplicates">查重中心 <i id="duplicateCount">0</i></button></div><div class="filters"><input id="search" placeholder="搜索公司、联系人、邮箱或标签"><select id="source"><option value="">全部来源</option><option value="website">独立站</option><option value="social">社交媒体</option><option value="customs">海关数据</option><option value="email">邮件</option></select></div></section>
<section class="view active" id="customers"><div class="table"><div class="tr th"><span>客户</span><span>来源与标签</span><span>阶段</span><span>最近跟进</span><span></span></div><div id="customerRows"></div></div><div class="empty" id="empty">暂无客户，点击右上角生成演示数据。</div></section>
<section class="view" id="board"><div class="board" id="kanban"></div><p class="hint">拖动客户卡片即可更新销售阶段，漏斗数字会实时重算。</p></section>
<section class="view" id="pool"><div class="section-title"><div><h2>团队公海</h2><p>长期未跟进的客户在这里重新流动。</p></div></div><div class="card-grid" id="poolGrid"></div></section>
<section class="view" id="duplicates"><div class="section-title"><div><h2>智能查重中心</h2><p>邮箱、域名精确匹配自动合并；公司名相似项由主管确认。</p></div></div><div class="card-grid" id="duplicateGrid"></div></section>
</main>
<dialog id="detail"><button class="close" aria-label="关闭">×</button><div id="detailBody"></div></dialog><div class="toast" id="toast"></div><script src="/admin/crm.js"></script></body></html>
